<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f1">
    <title>gzylz trades</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/config.js"></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/text.js"></script>
    <script defer src="js/cart.js"></script>
    <script defer src="js/home.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">gzylz trades</a>
        <nav>
            <a class="active" href="index.html">Home</a>
            <a href="audio.html">Audio</a>
            <a href="video.html">Video</a>
            <a href="rules.html">Rules</a>
        </nav>
        <button class="cart-trigger" type="button" data-cart-open>
            Copy <span data-cart-count>0</span>
        </button>
    </header>

    <button class="floating-copy" type="button" data-cart-open data-floating-copy hidden>
        Copy <span data-cart-count>0</span>
    </button>

    <main class="home-main">
        <div class="home-top-grid">
            <div class="home-welcome">
                <h1>Welcome!</h1>
                <p id="status-content" class="intro"></p>
            </div>
            <aside class="readme" id="readme">
                <h2 class="readme-title">READ ME</h2>
                <div id="readme-content" class="readme-content"></div>
            </aside>
        </div>

        <div class="search-counts">
            <span><strong data-audio-count>—</strong> audios</span>
            <span><strong data-video-count>—</strong> videos</span>
        </div>

        <input id="home-search" class="search-input" type="search" placeholder="Search shows, productions, masters…">

        <div class="search-filters">
            <button type="button" data-search-filter="all" class="active">All</button>
            <button type="button" data-search-filter="audio">Audio</button>
            <button type="button" data-search-filter="video">Video</button>
        </div>

        <p class="search-result-count" id="home-result-count"></p>
        <div class="search-results group-list" id="home-results"></div>

        <section class="browse-grid">
            <a class="browse-tile" href="audio.html">
                <span class="tile-title">Audio <span data-audio-count>—</span></span>
                <span class="tile-arrow">→</span>
            </a>
            <a class="browse-tile" href="video.html">
                <span class="tile-title">Video <span data-video-count>—</span></span>
                <span class="tile-arrow">→</span>
            </a>
            <a class="browse-tile" href="wants.html">
                <span class="tile-title">Wants</span>
                <span class="tile-arrow">→</span>
            </a>
        </section>
    </main>

    <dialog class="cart-dialog" id="cart-dialog">
        <div class="dialog-head">
            <h3>YOUR SELECTION</h3>
            <button class="icon-button" type="button" data-cart-close>×</button>
        </div>

        <div id="cart-content"></div>

        <div class="dialog-actions">
            <button class="button button-quiet" type="button" data-cart-clear>Clear all</button>
            <button class="button button-primary" type="button" data-cart-copy>Copy your selection</button>
        </div>

        <section class="cart-contact">
            <h3>Contact:</h3>
            <div id="contact-content-copy"></div>
        </section>

        <p class="copy-status" id="copy-status"></p>
    </dialog>

    <footer id="site-footer"></footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f1">
    <title>Text Converter — gzylz trades</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/converter.css">
    <script defer src="js/converter.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">gzylz trades</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="audio.html">Audio</a>
            <a href="video.html">Video</a>
            <a class="active" href="converter.html">Converter</a>
        </nav>
        <a class="cart-trigger" href="index.html">Back</a>
    </header>

    <main class="page-main converter-main">
        <div class="page-heading">
            <div>
                <h1>Text Converter</h1>
                <p>Convert recording lists into your Text format and Google Sheets TSV.</p>
            </div>
        </div>

        <section class="converter-section">
            <label for="record-kind">List type</label>
            <select id="record-kind">
                <option value="Audio">Audio</option>
                <option value="Video">Video</option>
            </select>

            <label for="source-text">Paste the original text</label>
            <textarea id="source-text" rows="12" placeholder="Paste one or more recording entries here. Separate entries with a blank line."></textarea>

            <div class="converter-actions">
                <button class="button button-primary" id="convert-button" type="button">Convert</button>
                <button class="button" id="clear-button" type="button">Clear</button>
            </div>
            <p class="converter-help">The results are shown separately: Text for your readable list, and TSV for Google Sheets. Please check the results before using them.</p>
        </section>

        <section class="converter-section">
            <div class="converter-output-heading">
                <h2>Text</h2>
                <button class="button" id="copy-text-button" type="button">Copy Text</button>
            </div>
            <textarea id="text-output" rows="12" readonly placeholder="Your formatted text will appear here."></textarea>
        </section>

        <section class="converter-section">
            <div class="converter-output-heading">
                <h2>TSV</h2>
                <button class="button" id="copy-tsv-button" type="button">Copy TSV</button>
            </div>
            <textarea id="tsv-output" rows="8" readonly placeholder="Your TSV for Google Sheets will appear here."></textarea>
            <p id="converter-status" class="converter-status"></p>
        </section>
    </main>
    <footer></footer>
</body>
</html>
